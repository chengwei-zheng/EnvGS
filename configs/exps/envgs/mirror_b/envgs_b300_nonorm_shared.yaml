# ABORTED 2026-10-18 15:00 (user meant StableNormal, see envgs_b300_shared.yaml); kept only for the record.
configs:
    - configs/base.yaml # default arguments for the whole codebase
    - configs/models/envgs.yaml # envgs model configuration
    - configs/datasets/mirror_b/b300.yaml # dataset usage configuration

# Shared-Gaussian reflection on scene B without any monocular normal prior (2026-10-18). Same as
# envgs_b300_gtnorm_shared except: data = b300 (StableNormal normals are still loaded but unused) and
# norm_loss_weight = 0. The prior-free self-consistency term gs_norm_loss (rendered normal vs depth normal, 0.04) is kept.
# Experiment record: ~/SMBC/EnvGS/experiments/2026-10-18_mirror_b_shared_normal_ablation.json
model_cfg:
    sampler_cfg:
        shared_reflection: True # trace self.pcd with override colour SH2RGB(_features_dc); env Gaussians unused
    supervisor_cfg:
        perc_loss_start_iter: 45000 # less iterations for faster training (same as envgs_b300_gtnorm)
        norm_loss_weight: 0.0 # no monocular normal prior anywhere

runner_cfg:
    epochs: 120

# prettier-ignore
exp_name: {{fileBasenameNoExtension}}
