configs:
    - configs/base.yaml # default arguments for the whole codebase
    - configs/models/envgs.yaml # envgs model configuration
    - configs/datasets/mirror_b/r300_lidarnorm.yaml # dataset usage configuration

# envgs_r300_lidarnorm_shared, unchanged training, plus logging of beta / reflection share / c_ref on the LiDAR mirror mask
# (MirrorRegionSupervisor log_mirror_stats, no loss) to see how beta recovers after each specular reset (2026-10-22).
# Only meant to run until ~25k iterations (resets at 6k..18k); the full run is envgs_r300_lidarnorm_shared.
model_cfg:
    sampler_cfg:
        shared_reflection: True
    supervisor_cfg:
        supervisor_cfgs:
            - type: VolumetricVideoSupervisor
            - type: EnvGSSupervisor
            - type: MirrorRegionSupervisor
        mirror_mask_dir: data/datasets/mirror_b/r300_lidarnorm_open3/mirror_masks
        log_mirror_stats: True
        norm_loss_weight: 0.05
        norm_ignore_zero: True
        perc_loss_start_iter: 45000 # less iterations for faster training

runner_cfg:
    epochs: 120

# prettier-ignore
exp_name: {{fileBasenameNoExtension}}
