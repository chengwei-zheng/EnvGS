detect_anomaly: false
deterministic: false
exp_name: envgs/mirror_b/envgs_b300_nmask_shared
fix_random: false
mocking: false
model_cfg:
    camera_cfg:
        type: NoopCamera
    chunkify_rays: false
    let_user_handle_input: true
    network_cfg:
        type: NoopNetwork
    renderer_cfg:
        type: NoopRenderer
    sampler_cfg:
        acc_filtering_start_iter: -1
        bounds:
        -   - -20.0
            - -20.0
            - -20.0
        -   - 20.0
            - 20.0
            - 20.0
        color_sabotage_until_iter: 18000
        densify_until_iter: 21000
        env_bounds:
        -   - -1.7995998523073242
            - -2.3450080304460066
            - -0.3936489577386566
        -   - 3.9480735241561606
            - 2.8875334781332533
            - 2.688360749359522
        env_densification_interval: 500
        env_densify_grad_threshold: 0.0001
        env_densify_until_iter: 21000
        env_min_weight_threshold: 0.1
        env_opacity_reset_interval: 6000
        env_preload_gs: data/datasets/mirror_b/b300_nmask/envs/points3D.ply
        env_prune_visibility: true
        env_sh_deg: 3
        env_sh_start_iter: 0
        min_weight_threshold: 0.1
        normal_prop_until_iter: 18000
        preload_gs: data/datasets/mirror_b/b300_nmask/sparse/0/points3D.ply
        prune_visibility: true
        render_reflection: true
        render_reflection_start_iter: 3000
        sh_deg: 3
        sh_start_iter: 0
        shared_reflection: true
        spatial_scale: 1.9667197923988438
        specular_channels: 1
        specular_filtering_start_iter: -1
        type: EnvGSSampler
        use_optix_tracing: true
        xyz_lr_scheduler:
            lr_delay_mult: 0.01
            lr_final: 1.6e-06
            lr_init: 0.00016
            max_steps: 30000
    supervisor_cfg:
        gs_dist_loss_weight: 0.0
        gs_norm_loss_start_iter: 0
        gs_norm_loss_weight: 0.04
        img_loss_type: L1
        img_loss_weight: 0.8
        norm_ignore_zero: true
        norm_loss_start_iter: 0
        norm_loss_weight: 0.01
        perc_loss_start_iter: 45000
        perc_loss_weight: 0.01
        ssim_loss_weight: 0.2
        supervisor_cfgs:
        -   type: VolumetricVideoSupervisor
        -   type: EnvGSSupervisor
        type: SequentialSupervisor
        use_dpt_scale_gs_norm_loss: true
        use_dpt_scale_norm_loss: true
    type: VolumetricVideoModel
preparing_parser: false
print_model: false
print_parameters: true
profiler_cfg:
    enabled: false
runner_cfg:
    ep_iter: 500
    epochs: 120
    eval_ep: 10
    evaluator_cfg:
        type: VolumetricVideoEvaluator
    log_interval: 1
    moderator_cfg:
        type: NoopModerator
    optimizer_cfg:
        eps: 1.0e-15
        lr: 0.05
        lr_table:
            _features_dc: 0.0025
            _features_rest: 0.000125
            _opacity: 0.05
            _rotation: 0.001
            _scaling: 0.005
            _specular: 0.01
            _xyz: 0.00016
        type: ConfigurableOptimizer
    record_images_to_tb: false
    recorder_cfg:
        type: TensorboardRecorder
    save_ep: 80
    save_latest_ep: 10
    scheduler_cfg:
        type: NoopLR
    type: VolumetricVideoRunner
    visualizer_cfg:
        result_dir: data/result
        save_tag: ''
        store_alpha_channel: false
        type: VolumetricVideoVisualizer
        types:
