configs:
    - configs/base.yaml # default arguments for the whole codebase
    - configs/models/envgs.yaml # envgs model configuration
    - configs/datasets/mirror_b/r300_lidarnorm.yaml # dataset usage configuration

# envgs_r300_gtnorm_nw5 with the GT mirror normal replaced by the normal of a plane fitted to the multi-echo LiDAR
# (mirror_lidar/LIDAR_MIRROR_NORMAL.md); the mirror boundary band is stored black and skipped (norm_ignore_zero).
# _shared (2026-10-21): envgs_r300_lidarnorm with shared_reflection on, cf. envgs_b300_gtnorm_shared.
model_cfg:
    sampler_cfg:
        shared_reflection: True # 2026-10-21 default; reflections trace the base Gaussians (SH DC colour), env Gaussians unused
    supervisor_cfg:
        norm_loss_weight: 0.05
        norm_ignore_zero: True
        perc_loss_start_iter: 45000 # less iterations for faster training

runner_cfg:
    epochs: 120

# prettier-ignore
exp_name: {{fileBasenameNoExtension}}
